name: Build cross-platform app

# Builds the Tauri edition (app/) for Windows, macOS and Linux.
# Runs when a tag like app-v2.0.0 is pushed, or by hand from the Actions tab.
# The result is a draft pre-release with the installers attached.

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
          - os: macos-latest
            args: '--target universal-apple-darwin --bundles dmg'
          - os: ubuntu-22.04
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libdbus-1-dev libx11-dev libxss-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install the Tauri CLI
        working-directory: app
        run: npm ci

      - name: Tests
        working-directory: app/src-tauri
        run: cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: app-v__VERSION__
          releaseName: 'SalamatYar __VERSION__ — cross-platform preview'
          releaseBody: 'Preview of the cross-platform edition for Windows, macOS and Linux. The stable Windows edition is version 1.3.'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
