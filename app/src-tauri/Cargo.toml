[package]
name = "salamatyar"
version = "2.0.1"
description = "Health reminders for computer work"
authors = ["Seyed Hamidreza Alavifar"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
user-idle = "0.6"
sys-locale = "0.3"
chrono = "0.4"
fastrand = "2"
open = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
