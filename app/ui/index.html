<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalamatYar</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="head">
    <div class="brand">
      <img src="logo.png" alt="">
      <div><b data-t="appName"></b><span data-t="subtitle"></span></div>
    </div>
    <nav class="nav" id="nav">
      <button class="tab on" data-page="dash" data-t="navDash"></button>
      <button class="tab" data-page="settings" data-t="navSettings"></button>
      <button class="tab" data-page="guide" data-t="navGuide"></button>
      <button class="tab" data-page="about" data-t="navAbout"></button>
    </nav>
    <div class="head-end">
      <button class="ghost small" id="btnLang" data-tip="langTooltip"></button>
      <div class="menu" id="langMenu" hidden></div>
    </div>
  </header>

  <main class="pages">
    <section class="page on" id="page-dash">
      <div class="cols c3" id="cards"></div>
      <div class="cols c5 tiles" id="tiles"></div>
      <div class="tip"><b data-t="tipLabel"></b><span id="tipText"></span></div>
    </section>

    <section class="page" id="page-settings">
      <div class="cols c2">
        <div class="card">
          <h4 data-t="setTiming"></h4>
          <div id="slTime"></div>
          <label class="check"><input type="checkbox" id="ck-idleDetect"><span data-t="ckIdle"></span></label>
          <div id="slIdle"></div>
          <button class="ghost block" id="btnDefaults" data-t="btnDefaults" style="margin-top:10px"></button>
        </div>
        <div class="card">
          <h4 data-t="setSound"></h4>
          <div id="slSound"></div>
          <div class="line">
            <label class="check"><input type="checkbox" id="ck-sound"><span data-t="ckSound"></span></label>
            <button class="ghost small" id="btnTestChime" data-t="btnPlay"></button>
          </div>
          <label class="check"><input type="checkbox" id="ck-music"><span data-t="ckMusic"></span></label>
          <div class="music">
            <div class="who"><span data-t="muEye"></span><small id="muEyeName"></small></div>
            <button class="ghost small" data-play="calm" data-t="btnPlay"></button>
            <button class="ghost small" data-pick="musicEye" data-t="btnPick"></button>
            <button class="ghost small" data-clear="musicEye" data-t="btnDefault"></button>
          </div>
          <div class="music">
            <div class="who"><span data-t="muMove"></span><small id="muMoveName"></small></div>
            <button class="ghost small" data-play="active" data-t="btnPlay"></button>
            <button class="ghost small" data-pick="musicMove" data-t="btnPick"></button>
            <button class="ghost small" data-clear="musicMove" data-t="btnDefault"></button>
          </div>
          <div class="sep"></div>
          <div class="line">
            <span data-t="themeLabel"></span>
            <div class="seg" id="segTheme">
              <button class="tab" data-v="dark" data-t="thDark"></button>
              <button class="tab" data-v="light" data-t="thLight"></button>
              <button class="tab" data-v="auto" data-t="thAuto" data-tip="ttThAuto"></button>
            </div>
          </div>
          <div class="line">
            <span data-t="dispLabel"></span>
            <div class="seg" id="segDisp">
              <button class="tab" data-v="full" data-t="dispFull" data-tip="ttDispFull"></button>
              <button class="tab" data-v="window" data-t="dispWindow" data-tip="ttDispWindow"></button>
              <button class="tab" data-v="tray" data-t="dispTray" data-tip="ttDispTray"></button>
            </div>
          </div>
          <div class="sep"></div>
          <label class="check"><input type="checkbox" id="ckAuto"><span data-t="ckAuto"></span></label>
        </div>
      </div>
    </section>

    <section class="page guide" id="page-guide">
      <div class="cols c2" id="guide"></div>
      <p class="foot-note" data-t="guideFoot"></p>
    </section>

    <section class="page about" id="page-about">
      <div class="cols c57">
        <div class="card">
          <img class="about-logo" src="logo.png" alt="">
          <h2 data-t="appName"></h2>
          <div class="ver" id="aboutVer"></div>
          <p data-t="aboutDesc"></p>
          <div class="sep"></div>
          <p data-t="aboutFree"></p>
          <p class="fine" data-t="aboutDisclaimer"></p>
        </div>
        <div class="card">
          <div class="kicker" data-t="aboutMaker"></div>
          <div class="name" data-t="authorName"></div>
          <div class="role" data-t="aboutRole"></div>
          <p data-t="aboutP1"></p>
          <p data-t="aboutP2"></p>
          <p data-t="aboutP3"></p>
          <div class="chips" id="chips"></div>
          <button class="btn" id="btnTelegram"></button>
        </div>
      </div>
    </section>
  </main>

  <footer class="bar">
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText"></span></div>
    <button class="ghost" id="btnReset" data-t="btnReset"></button>
    <button class="btn" id="btnPause"></button>
  </footer>
  <div class="sig" id="sig" data-tip="ttSig"></div>
</div>

<div class="veil" id="confirm" hidden>
  <div class="dialog" role="dialog" aria-modal="true">
    <h4 data-t="btnReset"></h4>
    <p data-t="confirmResetText"></p>
    <div class="acts">
      <button class="ghost" id="cfNo" data-t="btnCancel"></button>
      <button class="btn" id="cfYes" data-t="confirmYes"></button>
    </div>
  </div>
</div>

<script src="mock.js"></script>
<script src="common.js"></script>
<script src="main.js"></script>
</body>
</html>
